cv:
  name: Melisa K. Savich
  label: Cybersecurity Researcher & Technologist
  email: hello@melisasavich.com
  location: Michigan, USA
  image: ""
  summary: >-
    Cybersecurity researcher and technologist with experience in
    vulnerability research, threat modeling, security engineering,
    adversary simulation, and critical infrastructure security.
    My work spans embedded systems, firmware fuzzing, binary analysis,
    intrusion detection, and security automation. I am particularly
    interested in understanding how complex systems behave, where
    their assumptions break down, and how interdisciplinary
    approaches can inform the design of more secure and
    trustworthy technologies.

  social_networks:
    - network: GitHub
      username: m3lixir

  sections:
    Education:
      - institution: New York University
        location: New York, NY
        area: Computer Science
        studyType: Master of Science
        start_date: ""
        end_date: 2020
        highlights:
          - "Master's Thesis: Taint-Driven Firmware Fuzzing of Embedded Systems"
          - Research focused on vulnerability discovery and automated security testing of embedded firmware.

      - institution: University of Michigan
        location: Ann Arbor, MI
        area: Computer Science
        studyType: Bachelor of Science
        start_date: ""
        end_date: 2018
        highlights:
          - Academic background in computer science, programming, and computer security.
          - Instructional experience in computer security and data structures.

    Experience:
      - company: Sandia National Laboratories
        position: Cybersecurity R&D Engineer
        location: Livermore, CA
        start_date: 2020-06
        end_date: 2023-10
        summary: >-
          Conducted cybersecurity research and development focused
          on vulnerability discovery, automated security testing,
          and the evaluation of critical infrastructure systems.
        highlights:
          - Integrated multiple fuzzing tools into an automated security testing framework for critical infrastructure targets.
          - Conducted vulnerability research and binary analysis to identify security weaknesses in software and infrastructure systems.
          - Evaluated and optimized AFL++ fuzzing variants and developed custom mutation strategies for binary targets.
          - Developed and refined security testing workflows involving test harnesses, benchmarking, and vulnerability discovery.
          - Supported security engineering through code review, CI/CD integration, and improvements to testing and debugging workflows.

      - company: Sandia National Laboratories
        position: Critical Skills Recruiting Program Fellow
        location: Albuquerque, NM
        start_date: 2018-06
        end_date: 2020-05
        summary: >-
          Researched the security and resilience of industrial
          control systems and critical infrastructure through
          cyber modeling, simulation, and experimental testing.
        highlights:
          - Analyzed network topologies, vulnerabilities, and security risks in high-consequence ICS/SCADA environments.
          - Developed a Hardware-in-the-Loop framework for industrial control system modeling and data acquisition.
          - Conducted cyber modeling and simulation research to identify attack surfaces and evaluate infrastructure security.
          - Investigated cyber-physical system behavior and security considerations in controlled research environments.

      - company: Sandia National Laboratories
        position: Cybersecurity R&D Intern
        location: Albuquerque, NM
        start_date: 2017-05
        end_date: 2018-05
        summary: >-
          Supported experimental cybersecurity research involving
          industrial control systems, security monitoring,
          intrusion detection, and adversarial activity.
        highlights:
          - Automated security log ingestion and deployment of ELK Stack dashboards for monitoring an ICS/SCADA cyber range.
          - Configured and evaluated honeypots to simulate adversarial activity and assess intrusion detection effectiveness.
          - Supported experimental security monitoring and threat detection research in a controlled critical infrastructure environment.

      - company: University of Michigan
        position: Instructional Assistant
        location: Ann Arbor, MI
        start_date: 2016-09
        end_date: 2018-04
        summary: >-
          Provided technical instruction and academic support
          for undergraduate computer science and cybersecurity courses.
        highlights:
          - "EECS 388: Introduction to Computer Security"
          - "EECS 280: Programming and Introductory Data Structures"
          - Delivered technical instruction and hands-on assistance covering programming, computer security, and software development.
          - Helped students understand complex technical concepts through practical exercises and individualized guidance.

    Publications:
